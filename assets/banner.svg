<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="1180" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08121D"/>
      <stop offset="0.45" stop-color="#0E2234"/>
      <stop offset="1" stop-color="#143149"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF8A00"/>
      <stop offset="1" stop-color="#FFD24A"/>
    </linearGradient>
    <filter id="softGlow" x="0" y="0" width="1280" height="640" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <g opacity="0.18" filter="url(#softGlow)">
    <circle cx="260" cy="130" r="140" fill="#FFB347"/>
    <circle cx="1060" cy="520" r="160" fill="#5EC9FF"/>
  </g>

  <!-- ── Main app window ── -->
  <rect x="60" y="72" width="860" height="500" rx="16" fill="#0E1C2B" stroke="#2E455B" stroke-width="1.5"/>

  <!-- Toolbar strip -->
  <rect x="60" y="72" width="860" height="42" rx="16" fill="#0B1824"/>
  <rect x="60" y="98" width="860" height="16" fill="#0B1824"/>

  <!-- Toolbar buttons -->
  <rect x="80" y="82" width="70" height="22" rx="6" fill="#1A3550"/>
  <text x="115" y="97" text-anchor="middle" fill="#7AAEC8" font-family="Menlo,Consolas,monospace" font-size="11">Open</text>

  <rect x="160" y="82" width="76" height="22" rx="6" fill="#1A3550"/>
  <text x="198" y="97" text-anchor="middle" fill="#7AAEC8" font-family="Menlo,Consolas,monospace" font-size="11">Save As</text>

  <rect x="248" y="82" width="54" height="22" rx="6" fill="#1A3550"/>
  <text x="275" y="97" text-anchor="middle" fill="#7AAEC8" font-family="Menlo,Consolas,monospace" font-size="11">Edit</text>

  <!-- SET TC button (highlighted) -->
  <rect x="314" y="82" width="62" height="22" rx="6" fill="#3A2E00"/>
  <text x="345" y="97" text-anchor="middle" fill="#F8C66A" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="bold">SET TC</text>

  <!-- Jump TC field -->
  <rect x="400" y="82" width="130" height="22" rx="6" fill="#0D1F30" stroke="#2E4560"/>
  <text x="415" y="97" fill="#5E8AAA" font-family="Menlo,Consolas,monospace" font-size="11">01:24:07:03</text>

  <!-- Go button -->
  <rect x="540" y="82" width="40" height="22" rx="6" fill="#173A28"/>
  <text x="560" y="97" text-anchor="middle" fill="#5ECA8A" font-family="Menlo,Consolas,monospace" font-size="11" font-weight="bold">Go</text>

  <!-- ── Text area ── -->
  <rect x="80" y="128" width="590" height="420" rx="6" fill="#0A1620"/>

  <!-- Text lines -->
  <rect x="96" y="150" width="420" height="14" rx="4" fill="#173044"/>
  <rect x="96" y="174" width="500" height="14" rx="4" fill="#173044"/>
  <rect x="96" y="198" width="460" height="14" rx="4" fill="#173044"/>

  <!-- Line with TC highlight 1 -->
  <rect x="96" y="228" width="110" height="14" rx="4" fill="#173044"/>
  <rect x="214" y="226" width="118" height="18" rx="5" fill="#3A2E00"/>
  <text x="220" y="238" fill="#F8C66A" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700">01:23:45:12</text>
  <rect x="340" y="228" width="200" height="14" rx="4" fill="#173044"/>

  <rect x="96" y="258" width="380" height="14" rx="4" fill="#173044"/>
  <rect x="96" y="282" width="440" height="14" rx="4" fill="#173044"/>
  <rect x="96" y="306" width="360" height="14" rx="4" fill="#173044"/>

  <!-- Line with TC highlight 2 -->
  <rect x="96" y="336" width="80" height="14" rx="4" fill="#173044"/>
  <rect x="184" y="334" width="118" height="18" rx="5" fill="#3A2E00"/>
  <text x="190" y="346" fill="#F8C66A" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700">01:24:07:03</text>
  <rect x="310" y="336" width="240" height="14" rx="4" fill="#173044"/>

  <rect x="96" y="366" width="490" height="14" rx="4" fill="#173044"/>
  <rect x="96" y="390" width="410" height="14" rx="4" fill="#173044"/>

  <!-- Line with TC highlight 3 (newly SET) -->
  <rect x="96" y="426" width="140" height="14" rx="4" fill="#173044"/>
  <rect x="244" y="424" width="118" height="18" rx="5" fill="#3A2E00" opacity="0.85"/>
  <text x="250" y="436" fill="#F8C66A" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700">01:25:31:18</text>
  <text x="375" y="436" fill="#2A5040" font-family="Menlo,Consolas,monospace" font-size="12">← SET TC</text>

  <rect x="96" y="456" width="340" height="14" rx="4" fill="#173044"/>
  <rect x="96" y="480" width="440" height="14" rx="4" fill="#173044"/>

  <!-- ── TC Sidebar ── -->
  <rect x="686" y="128" width="220" height="420" rx="6" fill="#0D1A28" stroke="#2B4356" stroke-width="1"/>

  <!-- Sidebar header -->
  <rect x="686" y="128" width="220" height="30" rx="6" fill="#0B1824"/>
  <rect x="686" y="144" width="220" height="14" fill="#0B1824"/>
  <text x="774" y="148" text-anchor="middle" fill="#4E7A96" font-family="Avenir Next,Segoe UI,sans-serif" font-size="11">Timecodes</text>

  <!-- Sidebar row 1 (selected / highlighted) -->
  <rect x="690" y="164" width="212" height="34" rx="4" fill="#1A3A28"/>
  <text x="702" y="178" fill="#5ECA8A" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700">01:23:45:12</text>
  <text x="702" y="193" fill="#3E7A5A" font-family="Avenir Next,Segoe UI,sans-serif" font-size="10">Scene opens, camera pan…</text>

  <!-- Sidebar row 2 -->
  <rect x="690" y="204" width="212" height="34" rx="4" fill="#0F2030"/>
  <text x="702" y="218" fill="#F8C66A" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700">01:24:07:03</text>
  <text x="702" y="233" fill="#4A6880" font-family="Avenir Next,Segoe UI,sans-serif" font-size="10">Cut to close-up shot…</text>

  <!-- Sidebar row 3 -->
  <rect x="690" y="244" width="212" height="34" rx="4" fill="#0F2030"/>
  <text x="702" y="258" fill="#F8C66A" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700">01:25:31:18</text>
  <text x="702" y="273" fill="#4A6880" font-family="Avenir Next,Segoe UI,sans-serif" font-size="10">Dialogue starts, wide…</text>

  <!-- Sidebar row 4 -->
  <rect x="690" y="284" width="212" height="34" rx="4" fill="#0F2030"/>
  <text x="702" y="298" fill="#F8C66A" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700">01:26:44:00</text>
  <text x="702" y="313" fill="#4A6880" font-family="Avenir Next,Segoe UI,sans-serif" font-size="10">End of sequence, hold…</text>

  <!-- Sidebar row 5 -->
  <rect x="690" y="324" width="212" height="34" rx="4" fill="#0F2030"/>
  <text x="702" y="338" fill="#F8C66A" font-family="Menlo,Consolas,monospace" font-size="12" font-weight="700">01:28:02:14</text>
  <text x="702" y="353" fill="#4A6880" font-family="Avenir Next,Segoe UI,sans-serif" font-size="10">Music cue, fade in…</text>

  <!-- ── Right info panel ── -->
  <rect x="940" y="72" width="300" height="500" rx="20" fill="#0D1A28" stroke="#2B4356" stroke-width="1.5"/>

  <text x="990" y="136" fill="#FFFFFF" font-family="Avenir Next,Segoe UI,sans-serif" font-size="36" font-weight="700">DragonScript</text>
  <text x="990" y="170" fill="#95B5CF" font-family="Avenir Next,Segoe UI,sans-serif" font-size="17">DaVinci Resolve Utility</text>
  <text x="990" y="194" fill="#4E7A96" font-family="Menlo,Consolas,monospace" font-size="13">v2.7</text>

  <!-- CTA button -->
  <rect x="990" y="220" width="198" height="44" rx="12" fill="url(#accent)"/>
  <text x="1089" y="248" text-anchor="middle" fill="#172230" font-family="Avenir Next,Segoe UI,sans-serif" font-size="16" font-weight="700">Click TC → Jump</text>

  <!-- Feature list -->
  <text x="990" y="298" fill="#7AAEC8" font-family="Avenir Next,Segoe UI,sans-serif" font-size="14">▸ TC sidebar with preview</text>
  <text x="990" y="322" fill="#7AAEC8" font-family="Avenir Next,Segoe UI,sans-serif" font-size="14">▸ One-click playhead jump</text>
  <text x="990" y="346" fill="#7AAEC8" font-family="Avenir Next,Segoe UI,sans-serif" font-size="14">▸ SET TC stamps position</text>
  <text x="990" y="370" fill="#7AAEC8" font-family="Avenir Next,Segoe UI,sans-serif" font-size="14">▸ View / Edit toggle</text>
  <text x="990" y="394" fill="#7AAEC8" font-family="Avenir Next,Segoe UI,sans-serif" font-size="14">▸ Save As .txt</text>

  <!-- Divider -->
  <rect x="990" y="420" width="210" height="1.5" fill="#24415A" opacity="0.7"/>

  <text x="990" y="450" fill="#4E7A96" font-family="Avenir Next,Segoe UI,sans-serif" font-size="13">Stay in Resolve.</text>
  <text x="990" y="470" fill="#4E7A96" font-family="Avenir Next,Segoe UI,sans-serif" font-size="13">Work faster.</text>

  <!-- Bottom divider -->
  <rect x="60" y="590" width="1160" height="1.5" fill="#24415A" opacity="0.55"/>
</svg>
